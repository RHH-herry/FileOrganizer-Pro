name: 🐛 Bug 反馈
description: 报告 FileOrganizer Pro 使用中遇到的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写完整，这能让问题被更快定位。

        > ⚠️ **安全漏洞请勿在此提交** —— 请按 [SECURITY.md](../blob/main/SECURITY.md) 的负责任披露流程私下报告。

  - type: input
    id: version
    attributes:
      label: 软件版本
      description: 在「设置 → 关于」中查看，或对照 Releases 页面
      placeholder: "1.2.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11 (x64)
        - Windows 10 (x64)
        - 其他（请在描述中说明）
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 涉及功能模块
      options:
        - 快速整理
        - 自定义规则引擎
        - 批量重命名
        - 重复文件检测
        - 智能清理
        - 撤销 / 历史记录
        - 界面 / 主题
        - 安装 / 卸载 / 更新
        - 其他
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么？你期望发生什么？
      placeholder: |
        实际结果：……
        期望结果：……
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开「快速整理」
        2. 选择目录 D:\Downloads
        3. 点击「开始整理」
        4. 出现 ……
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏（可选）
      description: 直接把图片拖入此处即可上传

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认使用的是最新正式版
          required: true
        - label: 我已搜索过现有 Issue，没有重复
          required: true
        - label: 我的描述中不包含个人隐私信息（真实文件名、路径可脱敏）
          required: true
